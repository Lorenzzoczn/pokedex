<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pokédex interativa consumindo dados da PokéAPI">
    <title>Pokédex - Explore o Mundo Pokémon</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/responsive.css">
    
    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" alt="Pokéball">
                    <h1>Pokédex</h1>
                </div>
                
                <!-- Botão de tema -->
                <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Search Section -->
            <section class="search-section">
                <div class="search-container">
                    <input 
                        type="text" 
                        id="searchInput" 
                        class="search-input" 
                        placeholder="Buscar por nome ou número..."
                        aria-label="Buscar Pokémon"
                    >
                    <button class="search-btn" id="searchBtn" aria-label="Buscar">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </section>

            <!-- Pokemon List -->
            <section class="pokemon-section">
                <div id="pokemonList" class="pokemon-list">
                    <!-- Cards serão inseridos aqui via JavaScript -->
                </div>
                
                <!-- Loader -->
                <div id="loader" class="loader">
                    <div class="pokeball-loader">
                        <div class="pokeball-loader-inner"></div>
                    </div>
                    <p>Carregando Pokémons...</p>
                </div>
                
                <!-- Mensagem de erro -->
                <div id="errorMessage" class="error-message" style="display: none;">
                    <i class="fas fa-exclamation-triangle"></i>
                    <p>Pokémon não encontrado. Tente novamente!</p>
                </div>
            </section>

            <!-- Pagination -->
            <section class="pagination-section">
                <button class="pagination-btn" id="prevBtn" disabled>
                    <i class="fas fa-chevron-left"></i>
                    Anterior
                </button>
                
                <span class="pagination-info" id="paginationInfo">
                    Página 1
                </span>
                
                <button class="pagination-btn" id="nextBtn">
                    Próximo
                    <i class="fas fa-chevron-right"></i>
                </button>
            </section>
        </div>
    </main>

    <!-- Modal de Detalhes -->
    <div id="pokemonModal" class="modal">
        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="modal-content">
            <button class="modal-close" id="modalClose" aria-label="Fechar">
                <i class="fas fa-times"></i>
            </button>
            
            <div id="modalBody" class="modal-body">
                <!-- Conteúdo do modal será inserido via JavaScript -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>Desenvolvido com <i class="fas fa-heart"></i> usando <a href="https://pokeapi.co/" target="_blank" rel="noopener">PokéAPI</a></p>
            <p class="footer-credits">Projeto DIO - Pokédex JavaScript</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
